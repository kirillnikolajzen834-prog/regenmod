plugins {
    id 'net.neoforged.moddev' version '2.0.17'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
}

neoForge {
    version = "21.1.58"
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    
    mods {
        regenmod {
            sourceSet sourceSets.main
        }
    }
}
